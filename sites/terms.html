    <script>
      const translations = {
        es: {
          "page-title":        "SkillSwap | Términos y Condiciones",
          "meta-description":  "Términos y Condiciones de Uso de SkillSwap: servicio, cuentas, SkillCredits, verificación humana, datos personales (Ley 29733) y nuestro compromiso ético.",

          "skip-link":          "Saltar al contenido",

          "nav-plataforma":     "Plataforma",
          "nav-alianzas":       "Alianzas",
          "nav-sobre-nosotros": "Sobre nosotros",
          "nav-login":          "Iniciar Sesión",
          "nav-register":       "Registrarse",

          "terms-loading":      "Cargando…",
          "terms-error":        "No pudimos cargar los términos. Puedes leerlos aquí:",

          "footer-text":    "2026 SkillSwap. Todos los derechos reservados.",
          "footer-terms":   "Términos y Condiciones",
          "footer-privacy": "Política de Privacidad",
        },
        en: {
          "page-title":        "SkillSwap | Terms and Conditions",
          "meta-description":  "SkillSwap Terms and Conditions of Use: service, accounts, SkillCredits, human verification, personal data (Law 29733) and our ethical commitment.",

          "skip-link":          "Skip to content",

          "nav-plataforma":     "Platform",
          "nav-alianzas":       "Alliances",
          "nav-sobre-nosotros": "About us",
          "nav-login":          "Log In",
          "nav-register":       "Sign Up",

          "terms-loading":      "Loading…",
          "terms-error":        "We couldn't load the terms. You can read them here:",

          "footer-text":    "2026 SkillSwap. All rights reserved.",
          "footer-terms":   "Terms and Conditions",
          "footer-privacy": "Privacy Policy",
        }
      };

      /* ── Markdown mínimo → HTML (títulos, listas, citas, negritas, enlaces) ── */
      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function inline(s) {
        s = esc(s);
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
        s = s.replace(/\b([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/g, '<a href="mailto:$1">$1</a>');
        return s;
      }
      function mdToHtml(md) {
        const out = [];
        let para = [], quote = [], list = [];
        const flush = () => {
          if (para.length)  { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
          if (quote.length) { out.push('<blockquote><p>' + inline(quote.join(' ')) + '</p></blockquote>'); quote = []; }
          if (list.length)  { out.push('<ul>' + list.map(i => '<li>' + inline(i) + '</li>').join('') + '</ul>'); list = []; }
        };
        md.replace(/\r/g, '').split('\n').forEach(line => {
          let m;
          if (!line.trim())                      { flush(); }
          else if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flush(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); }
          else if ((m = line.match(/^>\s?(.*)$/)))   { if (para.length || list.length) flush(); quote.push(m[1]); }
          else if ((m = line.match(/^[-*]\s+(.*)$/))) { if (para.length || quote.length) flush(); list.push(m[1]); }
          else                                   { if (quote.length || list.length) flush(); para.push(line.trim()); }
        });
        flush();
        return out.join('\n');
      }

      let termsRequest = 0;
      async function loadTerms(lang) {
        const id = ++termsRequest;
        const box = document.getElementById('terms-content');
        const file = '../docs/terms-' + lang + '.md';
        box.setAttribute('aria-busy', 'true');
        try {
          const res = await fetch(file, { cache: 'no-cache' });
          if (!res.ok) throw new Error(res.status);
          const md = await res.text();
          if (id !== termsRequest) return;
          box.innerHTML = mdToHtml(md);
        } catch (e) {
          if (id !== termsRequest) return;
          box.innerHTML = '<p>' + translations[lang]['terms-error'] + ' <a href="' + file + '">terms-' + lang + '.md</a></p>';
        }
        box.setAttribute('aria-busy', 'false');
      }

      function applyLanguage(lang) {
        if (!translations[lang]) return;
        const t = translations[lang];
        document.documentElement.lang = skillswapHtmlLang(lang);
        document.title = t["page-title"];
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', t["meta-description"]);
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (t[key] !== undefined) el.textContent = t[key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        try { localStorage.setItem('skillswap-lang', lang); } catch (e) {}
        loadTerms(lang);
      }

      (function init() {
        applyLanguage(skillswapInitialLang());
      })();
    </script>
